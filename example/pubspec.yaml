name: sound_library_example
description: Browse, hear and copy every sound of the MIS Develop sound library. Live at sounds.library.misdevelop.com.
publish_to: none
version: 2.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  sound_library:
    path: ../
  google_fonts: ^9.0.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
