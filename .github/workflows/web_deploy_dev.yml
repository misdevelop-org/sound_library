name: Web deploy

on:
  push:
    branches: [ "main" ]

env:
  MIS_CHANNEL_ID: 'design-system-builds'
  WORKFLOW_NAME: 'Sounds Library deploy'
  DEPLOY_URL: 'https://sounds.library.misdevelop.com'
  HOST_FOLDER: 'mis-sounds-library'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Notify startup to MIS Slack channel
        id: slackStartUpProdMIS
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{env.MIS_CHANNEL_ID}}
          payload: |
            {
                "text": "${{ env.WORKFLOW_NAME }}: started! :chrome: :sparkles: :rocket:",
            	"blocks": [
            		{
            			"type": "section",
            			"text": {
            				"type": "mrkdwn",
            				"text": "${{ env.WORKFLOW_NAME }}: started! :chrome: :sparkles: :rocket:"
            			}
            		}
            	]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_MIS_BOT_TOKEN }}


      - uses: actions/checkout@v4

      #Install flutter latest version with cache
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Run Flutter build
        run: |
          cd example
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --wasm --pwa-strategy=none
  
      - name: Catch flutter build error
        if: ${{ failure()}}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{env.MIS_CHANNEL_ID}}
          # For posting a rich message using Block Kit
          payload: |
            {
                "text": "${{ env.WORKFLOW_NAME }}: failed! :exclamation:",
            	"blocks": [
            		{
            			"type": "section",
            			"text": {
            				"type": "mrkdwn",
            				"text": "${{ env.WORKFLOW_NAME }}: failed! :exclamation: :exclamation:"
            			}
            		}
            	],
            	"attachments": [
            		{
            			"color": "#632905",
            			"blocks": [
            				{
            					"type": "section",
            					"text": {
            						"type": "mrkdwn",
            						"text": "Check runner..."
            					}
            				}
            			]
            		}
            	]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_MIS_BOT_TOKEN }}

      - name: Create firebase.json file
        run: |
          echo '{
            "hosting": {
              "public": "build/web",
              "site": "mis-sounds-library",
              "ignore": [
                "firebase.json",
                "**/.*",
                "**/node_modules/**"
              ],
              "headers": [
                {
                  "source": "**",
                  "headers": [
                    { "key": "Cache-Control", "value": "no-cache" }
                  ]
                }
              ],
              "rewrites": [
                {
                  "source": "**",
                  "destination": "/index.html"
                }
              ]
            }
          }' > example/firebase.json

      # Authenticates with a service account instead of the deprecated `firebase deploy --token`.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MISDEVELOP }}
          projectId: misdevelop
          channelId: live
          entryPoint: example

      - name: Notify success to MIS Slack channel
        id: slackSuccessMIS
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{env.MIS_CHANNEL_ID}}
          payload: |
            {
                "text": "${{ env.WORKFLOW_NAME }}: done! :white-check-mark: :sparkles: :rocket:",
            	"blocks": [
            		{
            			"type": "section",
            			"text": {
            				"type": "mrkdwn",
            				"text": "${{ env.WORKFLOW_NAME }}: done! :white-check-mark: :sparkles: :rocket:"
            			}
            		}
            	],
            	"attachments": [
            		{
            			"color": "#5BE271",
            			"blocks": [
            				{
            					"type": "section",
            					"text": {
            						"type": "mrkdwn",
            						"text": "Access build at: ${{ env.DEPLOY_URL }}"
            					}
            				}
            			]
            		}
            	]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_MIS_BOT_TOKEN }}
