name: sound_library
description: >-
  23 free, categorized UI sounds bundled as assets, with a tiny SoundPlayer to play them
  (plus network, file and byte sources). No backend, no network needed.
version: 2.0.2
homepage: https://sounds.library.misdevelop.com
repository: https://github.com/misdevelop-org/sound_library
issue_tracker: https://github.com/misdevelop-org/sound_library/issues
topics:
  - audio
  - sounds
  - ui
  - sfx

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.5
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/sounds/interaction/
    - assets/sounds/navigation/
    - assets/sounds/feedback/
    - assets/sounds/commerce/
    - assets/sounds/brand/
